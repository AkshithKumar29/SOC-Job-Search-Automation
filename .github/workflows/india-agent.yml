name: India SOC Job Search Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8,14,20 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: read

concurrency:
  group: india-soc-agent
  cancel-in-progress: false

jobs:
  run-agent:
    name: Run India placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      TZ: 'Asia/Kolkata'
    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate infrastructure
        run: |
          python -m compileall -q agents utils tests
          python -m unittest discover -s tests -v
      - name: Execute India placeholder
        run: python agents/india_agent.py
      - name: Report execution status
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          echo "India SOC placeholder result: $RUN_STATUS"
          echo "### India SOC placeholder" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: $RUN_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "Schedule: 08:00, 14:00, 20:00 (Asia/Kolkata), every day." >> "$GITHUB_STEP_SUMMARY"
          echo "Trigger: $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
