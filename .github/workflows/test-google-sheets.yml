name: Test Google Sheets Connection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-google-sheets
  cancel-in-progress: false

jobs:
  test-google-sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test existing Google Sheets workbook
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scripts/test_google_sheets.py
      - name: Report test result
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          echo "Google Sheets connection test: $RUN_STATUS"
          echo "Google Sheets connection test: $RUN_STATUS" >> "$GITHUB_STEP_SUMMARY"
